name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_local_only
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://radar:radar_local_only@127.0.0.1:5432/radar_test
      TEST_DATABASE_URL: postgresql://radar:radar_local_only@127.0.0.1:5432/radar_test
      AI_MODE: DEMO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
